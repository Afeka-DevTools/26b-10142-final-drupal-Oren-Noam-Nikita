services:
  mysql:
    image: mysql:latest
    container_name: drupal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: drupal_db
      MYSQL_USER: drupal_user
      MYSQL_PASSWORD: drupal_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - drupal_network

  drupal:
    image: drupal:latest
    container_name: drupal-app
    depends_on:
      - mysql
    ports:
      - "8080:80"
    volumes:
      - drupal_data:/var/www/html
    networks:
      - drupal_network

networks:
  drupal_network:

volumes:
  mysql_data:
  drupal_data:

